<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Gravity Field</title>
    <meta
      name="description"
      content="A standalone cursor-reactive particle field demo with smooth gravity-inspired motion."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="demo">
      <canvas id="field" aria-hidden="true"></canvas>
      <div class="scrim" aria-hidden="true"></div>
      <section class="copy">
        <p class="eyebrow">Standalone demo</p>
        <h1>Mouse Gravity Field</h1>
        <p>
          Move the pointer to bend the field. The particles stay floaty, the motion stays calm,
          and the whole effect is packaged as a small public-ready demo.
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
